<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="SplitPee - Smart UPI Split. Modern light liquid-glass bill splitting and organisation app.">
  <meta name="theme-color" content="#087F75">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="SplitPee">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>SplitPee - Smart UPI Split</title>
  <link rel="manifest" href="manifest.json">
  <style>
    body {
      margin: 0;
      padding: 0;
      background: linear-gradient(135deg, #F3F8FB 0%, #EBF5F6 35%, #F6F7FD 72%, #F0FBF7 100%);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .liquid-loader {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      padding: 32px 48px;
      background: rgba(255, 255, 255, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-radius: 28px;
      border: 1.5px solid rgba(255, 255, 255, 0.9);
      box-shadow: 0 20px 40px rgba(15, 62, 80, 0.08);
    }
    .logo-badge {
      width: 52px;
      height: 52px;
      border-radius: 18px;
      background: linear-gradient(135deg, #2DD4BF, #087F75);
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      box-shadow: 0 10px 24px rgba(8, 127, 117, 0.35);
    }
    .brand-title {
      font-size: 20px;
      font-weight: 800;
      color: #172F3B;
      letter-spacing: -0.5px;
    }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2.5px solid #DDF4EB;
      border-top-color: #087F75;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    .made-in-india {
      font-size: 12.5px;
      font-weight: 600;
      color: #172F3B;
      letter-spacing: 0.2px;
      padding: 6px 14px;
      background: rgba(45, 212, 191, 0.12);
      border-radius: 20px;
      border: 1px solid rgba(8, 127, 117, 0.2);
      margin-top: 4px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="liquid-loader" id="loading">
    <div class="logo-badge">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M18 15l-6-6-6 6"/>
      </svg>
    </div>
    <div class="brand-title">SplitPee</div>
    <div class="spinner"></div>
    <div class="made-in-india">Made with ❤️ in India</div>
  </div>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
